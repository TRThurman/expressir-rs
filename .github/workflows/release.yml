# Release pipeline for expressir-rs.
#
# The P21 compile-parity gate (expressir#625) runs first: the sealed
# artifact's trees must replay the ruby compiler's output byte-for-byte
# and the population inventory must match the retired parser — drift
# here is a release blocker for both compilers. release-plz then
# creates the release PR (version + changelog) on every push to main;
# merging it tags and marks the release and publishes to crates.io
# (crates.io trusted publishing: the release-plz publish step runs
# under a crates.io OIDC trusted publisher — the OWNER registers the
# workflow once on crates.io (Publishing → Trusted Publishers) and
# no token secret exists at all; until that one-time registration the
# publish step fails harmlessly — see expressir#619).
#
# See: https://release-plz.dev/docs/config

name: Release

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  parity-gate:
    name: P21 compile-parity (drift is a release blocker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: The artifact replays the ruby trees and the retired inventory
        run: cargo test --test p21_parg_parity --test p21_population_parity

  release-plz:
    name: Release-plz
    needs: parity-gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    name: Publish the crate (crates.io trusted publishing)
    needs: parity-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # cargo >= 1.88 exchanges the Actions OIDC token for a crates.io
      # publish token when the registered trusted publisher matches
      # (owner lutaml, repo expressir-rs, workflow release.yml) — no
      # registry secret exists (#619).
      - name: Publish
        run: cargo publish

  binaries:
    name: Release binaries (${{ matrix.target }})
    needs: parity-gate
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v0.')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the CLI
        run: cargo build --release --bin expressir --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../expressir-${{ github.ref_name }}-${{ matrix.target }}.tar.gz expressir
          cd ../../..
          sha256sum expressir-${{ github.ref_name }}-${{ matrix.target }}.tar.gz >> checksums.txt
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/expressir.exe -DestinationPath expressir-${{ github.ref_name }}-${{ matrix.target }}.zip
          (Get-FileHash expressir-${{ github.ref_name }}-${{ matrix.target }}.zip -Algorithm SHA256).Hash | Out-File -Append -Encoding ascii checksums.txt
      - name: Attach the artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            expressir-*.tar.gz
            expressir-*.zip
            checksums.txt
